<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fyutr – Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="container">
  <div id="sidebar-mount"></div>
  <div class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="toggle-btn mobile-menu" onclick="toggleSidebar()">☰</button>
        <a href="dashboard.html" style="font-size:20px;text-decoration:none;">◀️</a>
        <h1 style="margin:0;">Settings</h1>
      </div>
      <p style="margin:0;font-size:16px;color:#888;">Customize your dashboard</p>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <p style="font-size:11px;opacity:0.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Account</p>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
        <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1E3A8A,#3B82F6);display:flex;align-items:center;justify-content:center;color:white;font-size:20px;font-weight:700;" id="avatar-letter">R</div>
        <div>
          <p style="margin:0;font-weight:600;" id="settings-name">Raiyan</p>
          <p style="margin:0;font-size:12px;color:#888;">student@fyutr.com &nbsp;·&nbsp; <span style="color:#1E3A8A;font-weight:600;">Student</span></p>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="settings-btn">✏️ Edit Profile</button>
        <button class="settings-btn">🔑 Change Password</button>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <p style="font-size:11px;opacity:0.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Preferences</p>
      <div class="srow"><span>Dark Mode</span><button class="settings-btn" onclick="toggleDarkMode()">🌙 Toggle</button></div>
      <div class="srow"><span>Currency</span>
        <select class="settings-select"><option>RM — Ringgit</option><option>USD — Dollar</option><option>SGD — Singapore</option></select>
      </div>
      <div class="srow"><span>Language</span>
        <select class="settings-select"><option>English</option><option>Bahasa Malaysia</option></select>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <p style="font-size:11px;opacity:0.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Notifications</p>
      <div class="srow"><span>Email Alerts</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
      <div class="srow"><span>Transaction Alerts</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
      <div class="srow"><span>Weekly Summary</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    </div>

    <div class="card">
      <p style="font-size:11px;opacity:0.5;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Account Actions</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="settings-btn">📤 Export Data</button>
        <button class="settings-btn" style="color:#ef4444;border-color:#ef4444;">🗑️ Delete Account</button>
        <button class="settings-btn" style="color:#ef4444;border-color:#ef4444;" onclick="logout()">🚪 Logout</button>
      </div>
    </div>

  </div>
</div>
<script src="assets/js/main.js"></script>
<script>
requireAuth();
const user = sessionStorage.getItem('fyutr_user') || 'Raiyan';
document.getElementById('settings-name').textContent = user;
document.getElementById('avatar-letter').textContent = user.charAt(0);
</script>
</body>
</html>
